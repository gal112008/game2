name: Build MonoGame Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest # Use windows because MonoGame often relies on DirectX/Windows build tools

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x # Match your project's version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore
